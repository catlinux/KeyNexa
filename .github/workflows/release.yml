name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# Read-only by default: only the job that publishes gets write access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned to the commit of the release they name, so a moved tag cannot change what runs next to the
# signing key. Building and signing are separate jobs: the build runs Gradle, its plugins and every dependency, and
# none of that code shares a machine with the keystore.
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check that the tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match VERSION $version" >&2
            exit 1
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Android SDK packages
        run: |
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$sdkmanager" || { echo 'sdkmanager not found under ANDROID_HOME' >&2; exit 1; }
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build and check
        run: |
          set -o pipefail
          ./gradlew build check :apps:android:assembleOfflineRelease :apps:android:assembleCloudRelease 2>&1 | tee gradle.log
      - name: Publish the Gradle error as an annotation
        if: failure()
        run: bash scripts/ci-gradle-error.sh gradle.log

      # Both flavors are published (ADR-0008): offline, with no network access at all, and cloud, which needs the
      # Internet permission for the optional cloud copies. The check makes sure each one is what its name promises.
      - name: Check the network permission of each APK
        run: |
          set -euo pipefail
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          out=apps/android/build/outputs/apk
          offline="$("$aapt2" dump permissions "$out/offline/release/keynexa-android-offline-release-unsigned.apk")"
          cloud="$("$aapt2" dump permissions "$out/cloud/release/keynexa-android-cloud-release-unsigned.apk")"
          if grep -q 'android.permission.INTERNET' <<< "$offline"; then
            echo '::error title=Release::the offline APK asks for the Internet permission' >&2
            exit 1
          fi
          if ! grep -q 'android.permission.INTERNET' <<< "$cloud"; then
            echo '::error title=Release::the cloud APK lacks the Internet permission it needs' >&2
            exit 1
          fi

      - name: Collect the unsigned APKs
        run: |
          mkdir -p "$RUNNER_TEMP/unsigned"
          cp apps/android/build/outputs/apk/offline/release/keynexa-android-offline-release-unsigned.apk "$RUNNER_TEMP/unsigned/"
          cp apps/android/build/outputs/apk/cloud/release/keynexa-android-cloud-release-unsigned.apk "$RUNNER_TEMP/unsigned/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-apk
          path: ${{ runner.temp }}/unsigned/
          if-no-files-found: error
          retention-days: 1

  # The Windows client (desktop plan, step 9): a per-user MSI and a portable ZIP, each with the Java runtime inside.
  # They are not signed (decision D9 is open), so SmartScreen will warn; the SHA-256 of every file is published.
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check that the tag matches VERSION
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match VERSION $version" >&2
            exit 1
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      # jpackage needs the WiX 3 tools to build an MSI; the runner image usually has them, and this installs them if not.
      - name: WiX tools
        shell: pwsh
        run: |
          $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset*' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $wix) {
            choco install wixtoolset --no-progress -y
            $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset*' | Select-Object -First 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $wix.FullName 'bin')

      - name: Check and package
        shell: bash
        run: ./gradlew :apps:desktop:check :apps:desktop:portableZip :apps:desktop:windowsMsi

      # The installer must work without administrator rights: install it for the current user, look for the program
      # and remove it again.
      - name: Install and uninstall the MSI
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          $msi = (Resolve-Path "apps/desktop/build/msi/KeyNexa-$version.msi").Path
          $log = Join-Path $env:RUNNER_TEMP 'install.log'
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /l*v `"$log`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "install failed: $($install.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'KeyNexa-app\KeyNexa.exe'
          if (-not (Test-Path $exe)) { throw "KeyNexa.exe not found at $exe" }
          $remove = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "uninstall failed: $($remove.ExitCode)" }
          if (Test-Path $exe) { throw 'KeyNexa.exe is still there after uninstalling' }

      - name: Collect the files and their checksums
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          mkdir -p "$RUNNER_TEMP/windows"
          cp "apps/desktop/build/msi/KeyNexa-$version.msi" "$RUNNER_TEMP/windows/KeyNexa-windows-x64-$version.msi"
          cp "apps/desktop/build/distributions/KeyNexa-windows-x64-$version.zip" "$RUNNER_TEMP/windows/"
          cd "$RUNNER_TEMP/windows"
          for file in *; do sha256sum "$file" > "$file.sha256"; done
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-dist
          path: ${{ runner.temp }}/windows/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: unsigned-apk
          path: ${{ runner.temp }}/unsigned
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-dist
          path: ${{ runner.temp }}/windows

      - name: Read VERSION
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Android build tools
        run: |
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$sdkmanager" || { echo 'sdkmanager not found under ANDROID_HOME' >&2; exit 1; }
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" 'build-tools;36.0.0'

      - name: Sign the APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          keystore="$RUNNER_TEMP/release.jks"
          out="$RUNNER_TEMP/dist"
          mkdir -p "$out"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          # The offline APK keeps the name earlier releases used; the cloud one gets its own.
          for flavor in offline cloud; do
            case "$flavor" in
              offline) name="keynexa-$VERSION.apk" ;;
              cloud) name="keynexa-cloud-$VERSION.apk" ;;
            esac
            "$tools/zipalign" -p -f 4 \
              "$RUNNER_TEMP/unsigned/keynexa-android-$flavor-release-unsigned.apk" \
              "$RUNNER_TEMP/aligned-$flavor.apk"
            "$tools/apksigner" sign \
              --ks "$keystore" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "$out/$name" \
              "$RUNNER_TEMP/aligned-$flavor.apk"
            "$tools/apksigner" verify --verbose "$out/$name"
            (cd "$out" && sha256sum "$name" > "$name.sha256")
          done
          rm -f "$keystore"

      # The signed update manifest of ADR-0015. The app trusts it only if it verifies with the public key it carries,
      # which is pinned here too, so a wrong secret stops the release instead of publishing a manifest no app accepts.
      # Without the secret the manifest is skipped and the release goes out as before.
      - name: Write and sign the update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::UPDATE_SIGNING_KEY is not set: no update manifest for this release"
            exit 0
          fi
          out="$RUNNER_TEMP/dist"
          manifest="$out/keynexa-update.txt"
          {
            printf 'keynexa-update 1\n'
            printf 'version %s\n' "$VERSION"
            printf 'released %s\n' "$(date -u +%Y-%m-%d)"
            for file in "$RUNNER_TEMP/windows/KeyNexa-windows-x64-$VERSION.msi" \
                        "$out/keynexa-$VERSION.apk" "$out/keynexa-cloud-$VERSION.apk"; do
              printf 'file %s %s %s\n' "$(basename "$file")" "$(stat -c %s "$file")" \
                "$(sha256sum "$file" | cut -d ' ' -f 1)"
            done
          } > "$manifest"
          key="$RUNNER_TEMP/update-key.pem"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in "$manifest" -out "$manifest.sig"
          rm -f "$key"
          public="$RUNNER_TEMP/update-public.pem"
          {
            echo '-----BEGIN PUBLIC KEY-----'
            echo 'MCowBQYDK2VwAyEAj7N0vtEMLww0R0qybVdJPcBXjETQDGqw+R4udkbu7uA='
            echo '-----END PUBLIC KEY-----'
          } > "$public"
          openssl pkeyutl -verify -pubin -inkey "$public" -rawin -in "$manifest" -sigfile "$manifest.sig"
          cat "$manifest"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "CHANGELOG.md has no entry for $VERSION" >&2
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          # Before 1.0 every release is a pre-release. The Windows client is still a preview (desktop plan, decision
          # D4), so while it is, 1.x releases are pre-releases too; this changes when the owner declares it stable.
          case "$VERSION" in 0.*|1.*) flags+=(--prerelease) ;; esac
          manifest=()
          if [ -f "$RUNNER_TEMP/dist/keynexa-update.txt" ]; then
            manifest=("$RUNNER_TEMP/dist/keynexa-update.txt" "$RUNNER_TEMP/dist/keynexa-update.txt.sig")
          fi
          gh release create "$TAG" "$RUNNER_TEMP"/windows/KeyNexa-windows-x64-"$VERSION".* \
            "$RUNNER_TEMP/dist/keynexa-$VERSION.apk" \
            "$RUNNER_TEMP/dist/keynexa-$VERSION.apk.sha256" \
            "$RUNNER_TEMP/dist/keynexa-cloud-$VERSION.apk" \
            "$RUNNER_TEMP/dist/keynexa-cloud-$VERSION.apk.sha256" \
            "${manifest[@]}" \
            --title "KeyNexa $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            "${flags[@]}"

      # The fixed address the apps read (ADR-0015): a branch holding only the manifest and its signature, rewritten as
      # a single commit after the release exists, so its files are there before any app is told about them.
      - name: Point the update channel at this release
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/dist/keynexa-update.txt"
          if [ ! -f "$manifest" ]; then exit 0; fi
          text="$(git hash-object -w "$manifest")"
          sig="$(git hash-object -w "$manifest.sig")"
          tree="$(printf '100644 blob %s\tkeynexa-update.txt\n100644 blob %s\tkeynexa-update.txt.sig\n' \
            "$text" "$sig" | git mktree)"
          commit="$(git commit-tree "$tree" -m "Update channel: $VERSION")"
          git push --force origin "$commit:refs/heads/update-channel"

      - name: Remove the keys
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/update-key.pem"
