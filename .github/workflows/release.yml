name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# Read-only by default: only the job that publishes gets write access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned to the commit of the release they name, so a moved tag cannot change what runs next to the
# signing key. Building and signing are separate jobs: the build runs Gradle, its plugins and every dependency, and
# none of that code shares a machine with the keystore.
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check that the tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match VERSION $version" >&2
            exit 1
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Android SDK packages
        run: |
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$sdkmanager" || { echo 'sdkmanager not found under ANDROID_HOME' >&2; exit 1; }
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build and check
        run: |
          set -o pipefail
          ./gradlew build check :app-android:assembleOfflineRelease :app-android:assembleCloudRelease 2>&1 | tee gradle.log
      - name: Publish the Gradle error as an annotation
        if: failure()
        run: bash scripts/ci-gradle-error.sh gradle.log

      # Both flavors are published (ADR-0008): offline, with no network access at all, and cloud, which needs the
      # Internet permission for the optional cloud copies. The check makes sure each one is what its name promises.
      - name: Check the network permission of each APK
        run: |
          set -euo pipefail
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          out=app-android/build/outputs/apk
          offline="$("$aapt2" dump permissions "$out/offline/release/app-android-offline-release-unsigned.apk")"
          cloud="$("$aapt2" dump permissions "$out/cloud/release/app-android-cloud-release-unsigned.apk")"
          if grep -q 'android.permission.INTERNET' <<< "$offline"; then
            echo '::error title=Release::the offline APK asks for the Internet permission' >&2
            exit 1
          fi
          if ! grep -q 'android.permission.INTERNET' <<< "$cloud"; then
            echo '::error title=Release::the cloud APK lacks the Internet permission it needs' >&2
            exit 1
          fi

      - name: Collect the unsigned APKs
        run: |
          mkdir -p "$RUNNER_TEMP/unsigned"
          cp app-android/build/outputs/apk/offline/release/app-android-offline-release-unsigned.apk "$RUNNER_TEMP/unsigned/"
          cp app-android/build/outputs/apk/cloud/release/app-android-cloud-release-unsigned.apk "$RUNNER_TEMP/unsigned/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-apk
          path: ${{ runner.temp }}/unsigned/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: unsigned-apk
          path: ${{ runner.temp }}/unsigned

      - name: Read VERSION
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Android build tools
        run: |
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$sdkmanager" || { echo 'sdkmanager not found under ANDROID_HOME' >&2; exit 1; }
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" 'build-tools;36.0.0'

      - name: Sign the APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          keystore="$RUNNER_TEMP/release.jks"
          out="$RUNNER_TEMP/dist"
          mkdir -p "$out"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          # The offline APK keeps the name earlier releases used; the cloud one gets its own.
          for flavor in offline cloud; do
            case "$flavor" in
              offline) name="keynexa-$VERSION.apk" ;;
              cloud) name="keynexa-cloud-$VERSION.apk" ;;
            esac
            "$tools/zipalign" -p -f 4 \
              "$RUNNER_TEMP/unsigned/app-android-$flavor-release-unsigned.apk" \
              "$RUNNER_TEMP/aligned-$flavor.apk"
            "$tools/apksigner" sign \
              --ks "$keystore" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "$out/$name" \
              "$RUNNER_TEMP/aligned-$flavor.apk"
            "$tools/apksigner" verify --verbose "$out/$name"
            (cd "$out" && sha256sum "$name" > "$name.sha256")
          done
          rm -f "$keystore"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "CHANGELOG.md has no entry for $VERSION" >&2
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          # Before 1.0 every release is a pre-release.
          case "$VERSION" in 0.*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" \
            "$RUNNER_TEMP/dist/keynexa-$VERSION.apk" \
            "$RUNNER_TEMP/dist/keynexa-$VERSION.apk.sha256" \
            "$RUNNER_TEMP/dist/keynexa-cloud-$VERSION.apk" \
            "$RUNNER_TEMP/dist/keynexa-cloud-$VERSION.apk.sha256" \
            --title "KeyNexa $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            "${flags[@]}"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
