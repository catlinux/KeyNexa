name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK packages
        run: |
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$sdkmanager" || { echo 'sdkmanager not found under ANDROID_HOME' >&2; exit 1; }
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      # Provides keepassxc-cli, which the differential test uses to compare vaults; without it the test is skipped.
      - name: Install KeePassXC
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends keepassxc
          keepassxc-cli --version
      - name: Build and check
        # pipefail: without it the step takes tee's exit code and a failed build looks green.
        run: |
          set -o pipefail
          ./gradlew build check :app-android:assembleOfflineRelease :app-android:assembleCloudRelease 2>&1 | tee gradle.log
      - name: Publish the Gradle error as an annotation
        if: failure()
        run: bash scripts/ci-gradle-error.sh gradle.log
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            **/build/reports
            **/build/test-results
          if-no-files-found: ignore

  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK packages
        run: |
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$sdkmanager" || { echo 'sdkmanager not found under ANDROID_HOME' >&2; exit 1; }
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --no-self-update
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/kdbx-dump-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tools/kdbx-dump-rs/Cargo.lock') }}
      - name: Build the keepass-rs dump tool
        working-directory: tools/kdbx-dump-rs
        run: cargo +1.99.0 build --release --locked
      - name: Differential test against keepass-rs
        # Absolute path: Gradle runs the test from the module folder.
        run: |
          set -o pipefail
          KEEPASS_RS_DUMP="$GITHUB_WORKSPACE/tools/kdbx-dump-rs/target/release/kdbx-dump" ./gradlew :core-kdbx:test --tests '*KeepassRsDifferential*' 2>&1 | tee gradle.log
      # Annotations can be read without signing in, unlike the logs; the vaults compared are the fictitious ones in testdata/.
      - name: Publish the failure as an annotation
        if: failure()
        run: |
          bash scripts/ci-gradle-error.sh gradle.log
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          for path in glob.glob('core-kdbx/build/test-results/test/*.xml'):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for failure in list(case.iter('failure')) + list(case.iter('error')):
                      message = (failure.get('message') or failure.text or '')[:3000]
                      message = message.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                      print(f"::error title=Test {case.get('name')}::{message}")
          PY

  docs-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check bilingual documentation
        run: bash scripts/check-docs-i18n.sh

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$sdkmanager" || { echo 'sdkmanager not found under ANDROID_HOME' >&2; exit 1; }
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: License report
        # pipefail: without it the step takes tee's exit code and a failed build looks green.
        run: |
          set -o pipefail
          ./gradlew generateLicenseReport 2>&1 | tee gradle.log
      - name: Publish the Gradle error as an annotation
        if: failure()
        run: bash scripts/ci-gradle-error.sh gradle.log
      - uses: actions/upload-artifact@v7
        with:
          name: dependency-license
          path: build/reports/dependency-license

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to the exact release: the scanner action warns that its behaviour can change between minor versions.
      - name: Scan distributed dependencies
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --lockfile=core-vault/gradle.lockfile
            --lockfile=core-kdbx/gradle.lockfile
            --lockfile=core-sync/gradle.lockfile
            --lockfile=platform-android/gradle.lockfile
            --lockfile=app-android/gradle.lockfile
            --lockfile=third_party/kotpass/gradle.lockfile

  # Informational only: build tools are not distributed with the app.
  build-tooling-vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan build tooling (informational)
        # On the step, not the job: a failed job paints a red cross on every commit even when it does not block.
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --lockfile=verification-metadata.xml:gradle/verification-metadata.xml
